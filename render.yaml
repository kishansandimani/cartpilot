# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
databases:
  - name: cartpilot-db
    plan: free

services:
  - type: web
    name: cartpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.3 }
      - { key: DATABASE_URL, fromDatabase: { name: cartpilot-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, sync: false }          # you will paste the frontend URL here
      - { key: PRODUCT_PROVIDER, value: channel3 }
      - { key: PRODUCT_CURRENCY, value: USD }
      - { key: PAYPAL_ENV, value: sandbox }
      - { key: PAYPAL_CURRENCY, value: USD }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, sync: false }
      - { key: GEMINI_FALLBACK_MODEL, sync: false }
      - { key: CHANNEL3_API_KEY, sync: false }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: INR_PER_USD, sync: false }

  - type: web
    name: cartpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_URL, sync: false }          # you will paste the backend URL here
    routes:
      - { type: rewrite, source: /*, destination: /index.html }